# Ce qui change d'une exécution à l'autre, phrase par phrase (eval.changes),
# puis analyse d'erreurs de la seconde. Ne relance aucun modèle.
#
# Par défaut : l'expérience du découpage avant traduction, phrases entières
# contre phrases découpées, pour voir ce que le découpage change aux
# traductions. Comparaison précédente (phase 1 contre plafond de longueur) :
# avant 36467549375 / phase1-mt-*, après 37398523459 / plafond-*.
name: Comparer deux exécutions

on:
  workflow_dispatch:
    inputs:
      avant_run:
        description: "Exécution de référence"
        default: "37399099065"
      avant_motif:
        description: "Ses artefacts"
        default: "decoupe-entieres"
      apres_run:
        description: "Exécution à comparer"
        default: "37399099065"
      apres_motif:
        description: "Ses artefacts"
        default: "decoupe-decoupees"
  push:
    branches: [claude/chat-ia-bambara-dho8oa]
    paths: [.github/workflows/compare-runs.yml, eval/changes.py]

permissions:
  actions: read
  contents: read

env:
  AVANT_RUN: ${{ inputs.avant_run || '37399099065' }}
  AVANT_MOTIF: ${{ inputs.avant_motif || 'decoupe-entieres' }}
  APRES_RUN: ${{ inputs.apres_run || '37399099065' }}
  APRES_MOTIF: ${{ inputs.apres_motif || 'decoupe-decoupees' }}

jobs:
  comparer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install numpy jiwer sacrebleu

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.AVANT_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ${{ env.AVANT_MOTIF }}
          path: avant
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.APRES_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ${{ env.APRES_MOTIF }}
          path: apres
          merge-multiple: true

      - name: Comparaison et analyse
        run: |
          {
            echo "## Ce qui change d'une exécution à l'autre"
            echo
            python -m eval.changes avant/*.json --apres apres/*.json
            echo
            echo "## Analyse d'erreurs de l'exécution comparée"
            echo
            python -m eval.analysis apres/*.json
          } | tee changements.md
          cat changements.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: changements
          path: changements.md
